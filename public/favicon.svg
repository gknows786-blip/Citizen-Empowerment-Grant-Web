<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Background -->
  <circle cx="50" cy="50" r="50" fill="#1B2A4A"/>
  
  <!-- Outer ring (gold for authority) -->
  <circle cx="50" cy="50" r="45" fill="none" stroke="#FFD700" stroke-width="2"/>
  
  <!-- Shield shape -->
  <path d="M 50 15 L 70 25 L 70 50 Q 50 70 50 70 Q 30 70 30 50 L 30 25 Z" fill="#3C3B6E" stroke="#FFD700" stroke-width="1.5"/>
  
  <!-- Inner seal circle -->
  <circle cx="50" cy="42" r="18" fill="#FFD700"/>
  
  <!-- Federal symbol (star) -->
  <g transform="translate(50, 42)">
    <polygon points="0,-12 3.5,-4 12,-3 8,3 10,12 0,8 -10,12 -8,3 -12,-3 -3.5,-4" fill="#1B2A4A"/>
  </g>
  
  <!-- Text arc (optional, simplified version) -->
  <text x="50" y="85" font-size="8" font-weight="bold" fill="#FFD700" text-anchor="middle">GRANT</text>
</svg>
