services:
  - type: web
    name: citizen-grant-api
    env: node
    region: oregon
    plan: starter
    
    # Build configuration
    buildCommand: npm install --no-audit --no-fund --maxsockets=4
    startCommand: node --import tsx src/backend.ts
    
    # Environment variables (set in Render dashboard)
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "5000"
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRE
        value: 7d
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: EMAIL_USER
        sync: false
      - key: EMAIL_PASSWORD
        sync: false
      - key: EMAIL_FROM
        value: support@usfederalgrant.gov
      - key: APP_URL
        value: https://citizen-empowerment-grant-web.onrender.com
      - key: FRONTEND_URL
        value: https://citizen-empowerment-grant-web.onrender.com

    # Health check
    healthCheckPath: /api/health
    
    # Auto-deploy
    autoDeploy: true
